version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: smart-classroom-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: smart-classroom-ai
    volumes:
      - mongo_data:/data/db

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: smart-classroom-ai-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - AI_SERVICE_PORT=8000
      - YOLO_MODEL=yolov8n.pt
      - DETECTION_CONFIDENCE=0.45

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-classroom-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/smart-classroom-ai
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=change-me-to-a-random-secret-string
      - JWT_EXPIRES_IN=7d
      - NODE_ENV=development
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      - mongodb
      - ai-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-classroom-frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
      - VITE_SOCKET_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  mongo_data:
  backend_uploads:
